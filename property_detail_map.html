<!DOCTYPE html>
<html>
<head>
    <title>Property Location</title>

    <meta charset="utf-8">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .property-popup {
            width: 240px;
            font-family: Arial, sans-serif;
        }

        .property-popup img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: #f3f3f3;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .property-popup h3 {
            margin: 5px 0 10px;
            font-size: 17px;
        }

        .property-popup p {
            margin: 6px 0;
            font-size: 13px;
        }

        .property-popup strong {
            color: #172033;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

    var map = L.map('map').setView([18.2955, 83.8942], 15);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    /*
       GREEN PROPERTY MARKER
    */

    var greenIcon = L.divIcon({
        className: '',
        html: `
            <div style="
                width:22px;
                height:22px;
                background:#1f8a68;
                border:3px solid white;
                border-radius:50% 50% 50% 0;
                transform:rotate(-45deg);
                box-shadow:0 2px 6px rgba(0,0,0,0.35);
            ">
                <div style="
                    width:8px;
                    height:8px;
                    background:white;
                    border-radius:50%;
                    margin:7px;
                "></div>
            </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -28]
    });


    /*
       PROPERTY MARKER
    */

    var marker = L.marker(
        [18.2955, 83.8942],
        {
            icon: greenIcon
        }
    ).addTo(map);


    /*
       DETAILS SHOWN INSIDE MARKER POPUP
    */

    var popupContent = `
        <div class="property-popup">

            <img
                src="/property_image/image_002.png"
                alt="Property Image"
            >

            <h3>Property Details</h3>

            <p>
                <strong>Type:</strong>
                FOR SALE
            </p>

            <p>
                <strong>Price:</strong>
                47 LAKH
            </p>

            <p>
                <strong>Area:</strong>
                Not detected
            </p>

            <p>
                <strong>BHK:</strong>
                Not detected
            </p>

            <p>
                <strong>Location:</strong>
                Nelamangala
            </p>

            <p>
                <strong>Capture Date:</strong>
                2026-09-18
            </p>

            <p>
                <strong>Latitude:</strong>
                18.2955
            </p>

            <p>
                <strong>Longitude:</strong>
                83.8942
            </p>

        </div>
    `;


    /*
       CLICK GREEN MARKER → OPEN POPUP
    */

    marker.bindPopup(
        popupContent,
        {
            maxWidth: 280,
            closeButton: true
        }
    );


</script>

</body>
</html>
